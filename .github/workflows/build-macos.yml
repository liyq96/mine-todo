name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-v*'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build universal macOS app
        run: wails build -clean -platform darwin/universal

      - name: Resolve app bundle path
        id: resolve-app
        run: |
          APP_PATH="$(find build/bin -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build/bin"
            ls -la build/bin || true
            exit 1
          fi
          echo "Resolved app bundle: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package app as zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.resolve-app.outputs.app_path }}" "dist/mine-todo-macos.zip"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: mine-todo-macos-app
          path: ${{ steps.resolve-app.outputs.app_path }}
          if-no-files-found: error

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: mine-todo-macos-zip
          path: dist/mine-todo-macos.zip
          if-no-files-found: error
